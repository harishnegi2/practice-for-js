<!DOCTYPE html>
<html lang="en">
<head>

<body id="a_body">





    <script>
        // 1.crete a header element/tag using js
        var h = document.createElement('header');
        h.innerHTML = "Header";
        console.log(h);
        
        // 2. now tell the js to place this header element inside the body of the html.
        document.getElementById('a_body').appendChild(h);

        document.querySelector('header').setAttribute("class","a_header");

        // object.member
        document.body.style.margin = "0px";

        var c = document.getElementsByClassName("a_header");
        // console.log(c[0]);
        c[0].style.width = "100%";
        c[0].style.height = "150px";
        c[0].style.border = "5px solid blue";

        var c =document.getElementsByTagName('header');
        // console.log(c[0]); 
        c[0].style.color="red";
        c[0].style.fontSize="3em";
        c[0].style.textAlign="center";
        c[0].style.lineHeight="150px";

        // 3. create a footer element/tag using js
        let f = document.createElement('footer');
        let n = document.createElement('nav');
        console.log(f);


        document.body.appendChild(n);
        var aside1 = document.createElement('aside');
        var section = document.createElement('section');
        var aside2 = document.createElement('aside2');

        document.body.appendChild(aside1); 
        document.body.appendChild(section); 
        document.body.appendChild(aside2); 



        document.body.appendChild(f);


        var d = document.querySelectorAll('footer'); 
        // console.log(d[0]);

        // element.setAttribute("attributeName","attributeValue");

        d[0].setAttribute("data_foot","foot1");
    
        
        var a =document.querySelector('footer[data_foot="foot1"]').style.textAlign ="center";
        console.log(a[0]);
        
        document.querySelector('[data_foot="foot1"]').style.color = "green";  
        document.querySelector('[data_foot="foot1"]').style.lineHeight = "150px";  
        
        
        
 
    </script>
    
</body>
